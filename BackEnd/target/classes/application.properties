spring.application.name=career-suggestion-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/career_suggestion?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
app.admin.id=${ADMIN_ID:admin}
app.admin.password=${ADMIN_PASSWORD:Password}
app.admin.token-secret=${ADMIN_TOKEN_SECRET:}
app.student.token-secret=${STUDENT_TOKEN_SECRET:}
